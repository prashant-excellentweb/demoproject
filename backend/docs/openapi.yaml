openapi: 3.0.3
info:
  title: ChatApp API
  version: 1.1.0
  description: "\nWhatsApp-clone REST API for Flutter/mobile clients.\n\n## Standard
    response format (all APIs)\n\nEvery endpoint returns the same JSON structure:\n\n```json\n{\n
    \ \"success\": true,\n  \"message\": \"Human readable message\",\n  \"data\":
    { }\n}\n```\n\nOn error:\n```json\n{\n  \"success\": false,\n  \"message\": \"Error
    description\",\n  \"data\": null\n}\n```\n\nValidation errors put field errors
    inside `data`.\n\n## Authentication\n1. `POST /api/auth/send-otp/` — send OTP
    to phone (no auth)\n2. `POST /api/auth/verify-otp/` — verify OTP, receive JWT
    `access` + `refresh` tokens\n3. Send header on all protected routes: `Authorization:
    Bearer <access_token>`\n4. `POST /api/auth/token/refresh/` — refresh access token\n\n##
    WebSocket (real-time chat)\n- URL: `ws://<host>:9000/ws/chat/?token=<access_token>`\n-
    Actions (JSON): `join_conversation`, `leave_conversation`, `typing`, `mark_read`\n-
    Events received: `message`, `message_deleted`, `message_updated`, `typing`, `read`\n\n##
    Message delete\n- `DELETE /api/chat/conversations/{id}/messages/{message_id}/`\n-
    Body: `{ \"delete_for\": \"me\" }` — hide only for current user\n- Body: `{ \"delete_for\":
    \"everyone\" }` — soft-delete for all (sender or group admin)\n\n## Reactions\n-
    `POST /api/chat/conversations/{id}/messages/{message_id}/react/`\n- Body: `{ \"emoji\":
    \"\U0001F44D\" }` — allowed: \U0001F44D ❤️ \U0001F602 \U0001F62E \U0001F622 \U0001F64F
    \U0001F525 \U0001F44F\n\n## Media uploads\nUse `multipart/form-data` for messages,
    profile avatar, and status media.\n    "
paths:
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Logout
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      summary: Get current user profile
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: auth_profile_partial_update
      summary: Update profile
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/search/:
    get:
      operationId: auth_search_retrieve
      summary: Search users
      parameters:
      - in: query
        name: q
        schema:
          type: string
        required: true
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/send-otp/:
    post:
      operationId: auth_send_otp_create
      summary: Send OTP via SMS
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      summary: Refresh JWT access token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/users/{user_id}/:
    get:
      operationId: auth_users_retrieve
      summary: Get user by ID
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/verify-otp/:
    post:
      operationId: auth_verify_otp_create
      summary: Verify OTP and login
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/chat/conversations/:
    get:
      operationId: chat_conversations_retrieve
      summary: List conversations
      tags:
      - Chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/conversations/{conversation_id}/group/:
    patch:
      operationId: chat_conversations_group_partial_update
      summary: Update group name or avatar (admin only)
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - Chat
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateGroupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateGroupRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateGroupRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/conversations/{conversation_id}/members/{user_id}/remove/:
    post:
      operationId: chat_conversations_members_remove_create
      summary: Remove member from group (admin only)
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/conversations/{conversation_id}/messages/:
    get:
      operationId: chat_conversations_messages_retrieve
      summary: Get messages
      parameters:
      - in: query
        name: before
        schema:
          type: integer
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - Chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/conversations/{conversation_id}/messages/{message_id}/:
    delete:
      operationId: chat_conversations_messages_destroy
      description: Use `delete_for=me` to hide the message only for the current user
        (others still see it). Use `delete_for=everyone` to soft-delete for all (sender
        or group admin only). Accepts JSON body or query param.
      summary: Delete message for me or for everyone
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      - in: path
        name: message_id
        schema:
          type: integer
        required: true
      tags:
      - Chat
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/chat/conversations/{conversation_id}/messages/{message_id}/react/:
    post:
      operationId: chat_conversations_messages_react_create
      summary: Add or toggle emoji reaction on a message
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      - in: path
        name: message_id
        schema:
          type: integer
        required: true
      tags:
      - Chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactToMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReactToMessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReactToMessageRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/conversations/{conversation_id}/read/:
    post:
      operationId: chat_conversations_read_create
      summary: Mark conversation as read
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - Chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/conversations/{conversation_id}/send/:
    post:
      operationId: chat_conversations_send_create
      summary: Send message
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - Chat
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/conversations/direct/:
    post:
      operationId: chat_conversations_direct_create
      summary: Start direct chat
      tags:
      - Chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectChatRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateDirectChatRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateDirectChatRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/conversations/group/:
    post:
      operationId: chat_conversations_group_create
      summary: Create group chat
      tags:
      - Chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/stories/{status_id}/delete/:
    delete:
      operationId: stories_delete_destroy
      summary: Delete own status
      parameters:
      - in: path
        name: status_id
        schema:
          type: integer
        required: true
      tags:
      - Stories
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/stories/{status_id}/view/:
    post:
      operationId: stories_view_create
      summary: Mark status as viewed
      parameters:
      - in: path
        name: status_id
        schema:
          type: integer
        required: true
      tags:
      - Stories
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/stories/{status_id}/viewers/:
    get:
      operationId: stories_viewers_retrieve
      summary: List status viewers
      parameters:
      - in: path
        name: status_id
        schema:
          type: integer
        required: true
      tags:
      - Stories
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/stories/create/:
    post:
      operationId: stories_create_create
      summary: Create status
      tags:
      - Stories
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateStatusRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/stories/feed/:
    get:
      operationId: stories_feed_retrieve
      summary: Status feed
      tags:
      - Stories
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    CreateDirectChatRequest:
      type: object
      properties:
        user_id:
          type: integer
      required:
      - user_id
    CreateGroupRequest:
      type: object
      properties:
        group_name:
          type: string
          minLength: 2
          maxLength: 100
        participant_ids:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 1
      required:
      - group_name
      - participant_ids
    CreateStatusRequest:
      type: object
      properties:
        status_type:
          $ref: '#/components/schemas/StatusTypeEnum'
        content:
          type: string
          default: ''
        media:
          type: string
          format: binary
          nullable: true
        background_color:
          type: string
          minLength: 1
          default: '#075E54'
          maxLength: 7
      required:
      - status_type
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        conversation:
          type: integer
        sender:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        message_type:
          $ref: '#/components/schemas/MessageTypeEnum'
        content:
          type: string
        file:
          type: string
          format: uri
          nullable: true
        file_url:
          type: string
          readOnly: true
        file_name:
          type: string
          maxLength: 255
        file_size:
          type: integer
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
        is_deleted:
          type: boolean
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reactions:
          type: string
          readOnly: true
        my_reaction:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - conversation
      - created_at
      - deleted_at
      - file_size
      - file_url
      - id
      - is_deleted
      - is_read
      - my_reaction
      - reactions
      - sender
    MessageTypeEnum:
      enum:
      - text
      - image
      - video
      - pdf
      - document
      - audio
      type: string
      description: |-
        * `text` - Text
        * `image` - Image
        * `video` - Video
        * `pdf` - PDF
        * `document` - Document
        * `audio` - Audio
    PatchedProfileUpdateRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 100
        about:
          type: string
          minLength: 1
          maxLength: 255
        avatar:
          type: string
          format: binary
          nullable: true
    PatchedUpdateGroupRequest:
      type: object
      properties:
        group_name:
          type: string
          maxLength: 100
        group_avatar:
          type: string
          format: binary
          nullable: true
    ReactToMessageRequest:
      type: object
      properties:
        emoji:
          type: string
          minLength: 1
          maxLength: 16
      required:
      - emoji
    SendMessageRequest:
      type: object
      properties:
        content:
          type: string
          default: ''
        message_type:
          allOf:
          - $ref: '#/components/schemas/MessageTypeEnum'
          default: text
        file:
          type: string
          format: binary
          nullable: true
    SendOTPRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - phone_number
    StatusTypeEnum:
      enum:
      - text
      - image
      - video
      type: string
      description: |-
        * `text` - Text
        * `image` - Image
        * `video` - Video
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    UserPublic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        phone_number:
          type: string
          maxLength: 20
        display_name:
          type: string
          maxLength: 100
        about:
          type: string
          maxLength: 255
        avatar_url:
          type: string
          readOnly: true
        is_online:
          type: boolean
        last_seen:
          type: string
          format: date-time
          nullable: true
      required:
      - avatar_url
      - id
      - phone_number
    VerifyOTPRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 20
        otp_code:
          type: string
          minLength: 6
          maxLength: 6
      required:
      - otp_code
      - phone_number
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Auth
  description: SMS OTP login, profile, user search
- name: Chat
  description: Conversations and messages
- name: Stories
  description: Status/stories (24h expiry)
